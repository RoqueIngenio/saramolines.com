# Robot de la web saramolines.com (PREPARADO, AÚN SIN ESTRENAR)
# Lee Notion (textos y artículos), genera la web y la publica en GitHub Pages.
# Empezará a funcionar cuando esta carpeta se suba a un repositorio de GitHub con el secreto NOTION_TOKEN.
# Se ejecutará:
#   - cada día a las 6:30 UTC (8:30 en horario de verano, 7:30 en invierno)
#   - cada vez que se suba un cambio al repositorio
#   - a mano: pestaña Actions > "Publicar la web" > Run workflow
name: Publicar la web

on:
  schedule:
    - cron: "30 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # solo para el paso «Mantener activa la ejecución diaria»
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # una publicación a medias se deja terminar; la siguiente espera su turno

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar la web
        uses: actions/checkout@v4

      - name: Generar la web con Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MARCAR_PUBLICADOS: si
        run: python3 robot/construir.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4

      # GitHub apaga las ejecuciones programadas tras 60 días sin cambios en el repositorio.
      # Volver a activar el flujo pone ese contador a cero, así que el robot no se para nunca.
      - name: Mantener activa la ejecución diaria
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publicar.yml/enable"
